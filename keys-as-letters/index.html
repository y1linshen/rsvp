<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keys as Letters</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #171717; font: 13px/1.4 ui-monospace, monospace; }
    main { position: relative; height: 100dvh; overflow: hidden; }
    canvas { display: block; }
    #keyboard { opacity: 0; position: absolute; left: 0; top: 0; width: 1px; height: 1px; padding: 0; border: 0; font-size: 16px; }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
  <script defer src="sketch.js?v=fullscreen"></script>
</head>
<body>
  <main id="paper" aria-label="Typewriter paper">
    <input id="keyboard" aria-label="Type on the paper" autocomplete="off" autocapitalize="none" spellcheck="false">
  </main>
</body>
</html>
