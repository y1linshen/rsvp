<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IBM SELECTRIC II 爆炸性招生</title><style>*{box-sizing:border-box}body{margin:0;background:repeating-linear-gradient(135deg,#ffed00 0 22px,#ffdb00 22px 44px);color:#d90000;font-family:Arial,'PingFang SC',sans-serif;font-weight:1000;text-align:center}main{max-width:680px;margin:auto;border:9px ridge red;padding:9px;overflow:hidden}.ticker{background:blue;color:white;overflow:hidden;white-space:nowrap;padding:7px}.ticker span{display:inline-block;animation:move 9s linear infinite}@keyframes move{to{transform:translateX(-50%)}}h1{font-family:Impact,'Arial Black',sans-serif;font-size:clamp(49px,11vw,100px);line-height:.83;letter-spacing:-.06em;margin:30px 0 15px;transform:rotate(-4deg);text-shadow:3px 3px white,6px 6px #000;color:red}.burst{background:#ff0099;color:white;clip-path:polygon(50% 0,59% 12%,74% 2%,77% 18%,95% 15%,89% 33%,100% 44%,90% 55%,100% 73%,80% 74%,84% 95%,63% 86%,50% 100%,38% 86%,16% 96%,20% 76%,0 74%,10% 55%,0 42%,15% 34%,5% 15%,25% 19%,29% 0,41% 12%);padding:25px 20px;display:inline-block;transform:rotate(9deg);font-size:26px}.offer{background:red;color:yellow;border:5px dashed white;padding:12px 0;font-size:clamp(28px,7vw,50px);transform:rotate(-2deg);text-shadow:2px 2px black}.goods{font-size:52px;margin:8px}.info{border:5px solid blue;color:blue;background:white;font-size:25px;padding:10px;transform:rotate(1deg)}form{display:grid;gap:8px;padding:10px}input,button{font:inherit;border:4px solid red;padding:12px;border-radius:0;font-size:20px}button{background:#00ef00;color:#000;box-shadow:5px 5px black;cursor:pointer;font-size:30px}button:disabled{opacity:.5}.spots{font-size:35px;color:red}footer{background:red;color:white;padding:7px}@media(prefers-reduced-motion:reduce){.ticker span{animation:none}}body{font-family:'Songti SC','SimSun',serif}.offer,.burst{font-family:'Kaiti SC','KaiTi',serif}dialog{border:10px ridge red;background:#fff000;color:red;padding:30px;max-width:90vw;font-family:'Kaiti SC','KaiTi',serif;font-size:clamp(30px,8vw,68px);animation:pop .45s ease-out}dialog::backdrop{background:#0009}dialog button{font-size:20px}@keyframes pop{from{transform:scale(.1) rotate(-30deg)}to{transform:scale(1) rotate(-5deg)}}@media(prefers-reduced-motion:reduce){dialog{animation:none}}</style><main><div class="ticker"><span>特大喜讯 ★ 机会难得 ★ 火热报名中 ★ 特大喜讯 ★ 机会难得 ★ 火热报名中 ★ </span></div><div style="font-size:28px;color:blue">热烈欢迎广大群众参加！！！</div><h1>IBM<br>SELECTRIC II<br>TYPEWRITER<br>WORKSHOP</h1><div class="burst">仅限3人<br>手慢无！</div><div class="offer">参与活动领取米面油！</div><div class="goods">🍚 🌾 🛢️</div><div class="info">活动地址：205 Church St<br>活动时间：TBD</div><div class="spots">剩余名额：<span id="n">3</span> 位</div><form id="f"><input required placeholder="姓名 / NAME"><input required type="email" placeholder="邮箱 / EMAIL"><button>☞ 疯狂抢位 RSVP ☜</button></form><p id="msg" aria-live="polite"></p><footer>机不可失 · 时不再来 · 报完即止</footer></main><dialog id="success"><strong>报名成功！</strong><p style="font-size:20px">米面油等你来领！</p><button type="button" onclick="this.closest('dialog').close()">好嘞！</button></dialog><script>let n=3;f.onsubmit=e=>{e.preventDefault();if(n){document.querySelector('#n').textContent=--n;msg.textContent='恭喜抢位成功！（演示）';document.querySelector('#success').showModal();f.reset();if(!n){f.querySelector('button').disabled=true;f.querySelector('button').textContent='名额已抢光！'}}}</script></html>
