<style>

tter-spacing:-2px}.offer .big{font-family:'Kaiti SC',KaiTi,serif;font-size:1.6em;line-height:1}.offer .line{font-size:17px;color:white;letter-spacing:3px}.details{display:grid;grid-template-columns:1fr 1fr;border:4px solid #1227c8;margin:17px 0 7px;color:#1227c8;background:#fff;padding:9px;gap:12px;transform:rotate(1deg)}.details small{display:block;font-size:15px}.details strong{font:900 clamp(22px,4.8vw,44px)/1.1 'Times New Roman',serif}.details>div+div{border-left:3px solid #1227c8;padding-left:12px}.registration{border:3px solid #111;padding:9px;margin-top:16px;background:#fffbba}.spots{text-align:center;font-size:26px;line-height:1.1}.spots span{color:#e00000;font:900 64px Impact,sans-serif;vertical-align:middle}form{display:grid;gap:8px;margin-top:10px}label{font-size:17px}input{display:block;width:100%;background:#fff;border:2px solid #111;padding:12px;font-size:19px;margin-top:3px}input:focus{outline:4px solid #152bdb;outline-offset:1px}form button{border:4px solid #111;background:#00f330;color:#111;box-shadow:5px 5px #111;padding:9px 4px;font:900 clamp(25px,5.8vw,52px) 'Kaiti SC',KaiTi,serif;transform:rotate(-1deg);margin:5px 5px 6px 0}form button:hover{transform:rotate(1deg) scale(1.02);background:#ff79dc}form button:active{box-shadow:1px 1px #111;translate:3px 3px}button:disabled{cursor:default;opacity:.6}.demo{font:12px/1.5 sans-serif;text-align:center;margin:10px 0 0}#msg{text-align:center;margin:6px 0;font-size:18px;color:#d00000}dialog{padding:20px;border:9px double #e00000;background:#fff000;color:#e00000;width:min(640px,92vw);overflow:visible;text-align:center;box-shadow:14px 14px #000;transform:rotate(-4deg)}dialog[open]{animation:slam .6s cubic-bezier(.2,1.5,.5,1)}dialog::backdrop{background:#071059bf}dialog strong{font:900 clamp(52px,12vw,96px)/1.1 'Kaiti SC',KaiTi,serif;display:block;margin:18px -10px;text-shadow:3px 3px white}dialog p{font-size:24px;margin:10px}dialog button{border:3px solid #111;background:#00f330;box-shadow:4px 4px #111;padding:10px 22px;font-size:22px}#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}#confetti i{position:absolute;top:-60px;font:900 25px 'Kaiti SC',KaiTi,serif;animation:rain 2.6s ease-in forwards;color:var(--c);left:var(--x);animation-delay:var(--d)}@keyframes rain{to{transform:translateY(115vh) rotate(640deg)}}@keyframes slam{from{transform:scale(2.2) rotate(18deg);opacity:0}to{transform:scale(1) rotate(-4deg);opacity:1}}@media(max-width:600px){.wall{padding:25px 13px 45px}.poster{padding:8px}.ibm{margin-left:4px}.model{margin-left:0}.hero{padding-top:15px}.offer{margin-left:-6px;margin-right:-6px}.offer .small{font-size:16px;letter-spacing:5px}.offer .line{font-size:12px;letter-spacing:1px}.spots{font-size:21px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important}#confetti{display:none}}
</style></head><body><div class="wall"><main class="poster"><h1 class="hero" aria-label="IBM Selectric II Typewriter Workshop"><div class="ibm">IBM</div><div class="model">SELECTRIC II</div><div class="english">TYPEWRITER<br>WORKSHOP</div></h1><section class="offer"><div class="small">参与活动领取</div><h2><span class="big">米！面！油！</span></h2></section><section class="details"><div><small>活动地址 / ADDRESS</small><strong>205 Church St</strong></div><div><small>活动时间 / WHEN</small><strong>TBD / 待定</strong></div></section><section class="registration"><div class="spots">剩余名额 <span id="n">3</span> 位 </div><form id="f"><label>尊姓大名 / NAME<input name="name" autocomplete="name" required placeholder="请在此留下大名"></label><label>电子信箱 / EMAIL<input name="email" autocomplete="email" required type="email" placeholder="您的邮箱，非常重要"></label><button type="submit">☞ 立 即 抢 位 ☜</button></form><p id="msg" aria-live="polite"></p><p class="demo">报名演示：暂不保存姓名与邮箱，名额未在访客间同步。</p></section></main></div><dialog id="success" aria-labelledby="success-title"><strong id="success-title">报名成功！</strong><p>米面油等你来领！</p><p style="font-size:13px">演示成功 · 尚未提交真实报名</p><button type="button" id="close">好嘞！一言为定！</button><div id="confetti" aria-hidden="true"></div></dialog><script>
const form=document.querySelector('#f'),count=document.querySelector('#n'),message=document.querySelector('#msg'),success=document.querySelector('#success'),confetti=document.querySelector('#confetti');let remaining=3;
form.addEventListener('submit',event=>{event.preventDefault();if(!remaining)return;remaining--;count.textContent=remaining;message.textContent='恭喜抢位成功！（演示）';confetti.replaceChildren();success.showModal();if(!matchMedia('(prefers-reduced-motion: reduce)').matches){for(let i=0;i<30;i++){const piece=document.createElement('i');piece.textContent=['米','面','油','★','喜'][i%5];piece.style.setProperty('--x',Math.random()*100+'%');piece.style.setProperty('--d',Math.random()*.7+'s');piece.style.setProperty('--c',['#ff0080','#00b924','#1429d4','#e00000'][i%4]);confetti.append(piece)}}form.reset();if(!remaining){const button=form.querySelector('button');button.disabled=true;button.textContent='名额已抢光！'}});document.querySelector('#close').addEventListener('click',()=>success.close());success.addEventListener('close',()=>confetti.replaceChildren());
</script></body></html>
