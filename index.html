body{background:#f3f1e8;color:#001ac6;font-family:WorkshopKai,'Kaiti SC',KaiTi,'Songti SC',serif}body:before{opacity:.045}.wall{max-width:1000px;padding:30px 25px 55px}.poster{background:#fff000;border:15px ridge #f12519;box-shadow:inset 0 0 0 5px #fffba0,3px 5px 0 #a20000;transform:none;max-width:860px;padding:30px 25px}.poster:before,.poster:after{display:none}.hero{text-align:center;transform:rotate(-5deg) skewX(-5deg);padding:30px 0 35px;margin:0 0 25px}.ibm,.model,.english{font-family:'Times New Roman',Times,serif;font-style:italic;font-weight:900;letter-spacing:-.075em;color:#f00000;background:none;width:auto;text-shadow:3px 3px #fff,6px 6px #fff,9px 9px #0016ba;transform:none;margin:0;padding:0;line-height:.93}.ibm{font-size:clamp(72px,15vw,145px);margin-bottom:4px}.model{font-size:clamp(40px,8.8vw,86px)}.english{font-size:clamp(38px,8.2vw,80px)}.offer{margin:12px 0 30px;padding:15px 8px 22px;transform:rotate(-3deg);border:7px double white;background:#f00000;color:#fff000;text-shadow:3px 4px #111}.offer .small{font-family:WorkshopKai,'Kaiti SC',serif;font-size:clamp(27px,6vw,52px);letter-spacing:0;line-height:1.4}.offer h2{font-size:clamp(35px,8vw,70px);line-height:1.3}.offer .big{font-family:WorkshopKai,'Kaiti SC',serif;font-size:1em}.details{background:transparent;border:0;padding:8px 3px;gap:9px;transform:rotate(1deg);margin:15px 0 20px}.details small{font-size:17px}.details strong{font-family:WorkshopKai,'Kaiti SC','Times New Roman',serif;font-size:clamp(23px,4.5vw,43px);line-height:1.3}.details>div+div{border-left:2px solid #001ac6}.registration{background:transparent;border:4px double #001ac6;padding:16px;transform:rotate(-.6deg)}.spots{font-size:30px}.spots span{font-family:'Times New Roman',serif;font-style:italic;font-size:70px;color:red;text-shadow:2px 2px #fff,4px 4px blue}label{font-size:22px}input{border:3px solid #001ac6;background:#fffef0;font-family:WorkshopKai,'Kaiti SC',serif;color:#111}form button{font-family:WorkshopKai,'Kaiti SC',serif;background:#20ff00;border:5px double #001ac6;color:#001ac6;box-shadow:4px 5px #001ac6;font-size:clamp(30px,6vw,54px);transform:rotate(1deg)}form button:hover{background:#fff;transform:rotate(-1deg)}.demo{color:#001ac6;font-size:11px}dialog strong,dialog button,#confetti i{font-family:WorkshopKai,'Kaiti SC',serif}dialog strong{text-shadow:3px 3px #fff,6px 6px #0016ba}dialog{border:12px ridge red}
@media(max-width:600px){.wall{padding:15px 10px 30px}.poster{padding:20px 13px;border-width:10px}.hero{padding:20px 0 25px;margin-bottom:18px}.offer{margin:8px 0 22px;padding:12px 5px 18px}.offer .small{font-size:29px;letter-spacing:0}.offer h2{font-size:42px}.details small{font-size:13px}.details strong{font-size:23px}.registration{padding:10px}.spots{font-size:25px}label{font-size:20px}}

.news{overflow:hidden;background:#0800e8;color:#fff;padding:10px 0;border:2px solid #fff;font:900 clamp(18px,3.5vw,32px)/1.3 WorkshopKai,'Kaiti SC',serif;white-space:nowrap}.news span{display:inline-block;animation:bulletin 19s linear infinite}.trade{margin:10px 0 0;font-size:clamp(18px,3.3vw,30px);font-weight:900;letter-spacing:1px}.good-news{font:900 clamp(64px,13vw,120px)/1.2 WorkshopKai,'Kaiti SC',serif;color:red;text-align:center;margin:0 0 18px;text-shadow:3px 3px #fff,6px 6px #0016ba;transform:rotate(3deg);animation:headline-bounce 3.8s ease-in-out infinite}.badges{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:0 0 22px}.imported{background:red;color:#fff000;font-size:clamp(20px,4.2vw,37px);padding:10px;transform:rotate(-9deg);box-shadow:2px 2px #c10000;animation:label-left 4s ease-in-out infinite}.teaching{border:6px double #0016ba;font-size:clamp(19px,4vw,35px);padding:7px 10px;line-height:1.3;transform:rotate(9deg);animation:label-right 4.6s ease-in-out infinite}.hero{animation:title-float 6s ease-in-out infinite}.exchange{font:900 clamp(19px,4vw,36px)/1.2 WorkshopKai,'Kaiti SC',serif;text-align:right;margin:-12px 0 35px;transform:rotate(-2deg)}.free{position:absolute;right:-5px;top:-25px;background:#19ff00;border:5px double #0016ba;color:#0016ba;font:900 clamp(22px,4.2vw,36px)/1.2 WorkshopKai,'Kaiti SC',serif;padding:6px 10px;text-shadow:none;transform:rotate(12deg);animation:label-right 3.6s ease-in-out infinite;z-index:1}.prizes{display:flex;gap:9px;margin:0 0 25px;align-items:stretch}.prizes>div{width:33.333%;border:4px solid red;background:white;padding:10px 3px;color:#e00000;text-align:center;font:900 clamp(16px,3vw,28px)/1.2 WorkshopKai,'Kaiti SC',serif;transform:rotate(-5deg)}.prizes>div:nth-child(2){border:4px dashed blue;color:blue;transform:rotate(3deg)}.prizes>div:nth-child(3){transform:rotate(-2deg)}.prizes span{display:block;font-family:system-ui;font-size:clamp(40px,8vw,76px);margin-bottom:7px;animation:goods-hop 4.5s ease-in-out infinite}.prizes>div:nth-child(2) span{animation-delay:.5s}.prizes>div:nth-child(3) span{animation-delay:1s}form button{animation:button-nudge 5s ease-in-out infinite}form button:hover,form button:focus-visible{animation:none}dialog[open] strong{animation:success-pop 2s ease-in-out infinite}dialog[open]{background:radial-gradient(circle at center,#fff000 30%,#ffc400 100%)}

</style></head><body><div class="wall"><main class="poster"><div class="news"><span>★ 街坊邻居请注意！！！好消息！！！相互转告！！！ ★ 街坊邻居请注意！！！好消息！！！相互转告！！！ ★ </span></div><p class="trade">一技在手　终身受益</p><h2 class="good-news">特大喜讯!</h2><div class="badges"><span class="imported">美国进口技术</span><span class="teaching">现场教学<br>包教不包会</span></div><h1 class="hero" aria-label="IBM Selectric II Typewriter Workshop"><div class="ibm">IBM</div><div class="model">SELECTRIC II</div><div class="english">TYPEWRITER<br>WORKSHOP</div></h1><p class="exchange">机械打字技术交流活动</p><section class="offer"><span class="free">免费领取</span><div class="small">参与活动领取</div><h2><span class="big">米！面！油！</span></h2></section><div class="prizes" aria-label="活动赠品"><div><span>🍚</span>优质大米</div><div><span>🌾</span>精制面粉</div><div><span>🌻</span>食用好油</div></div><section class="details"><div><small>活动地址 / ADDRESS</small><strong>205 Church St</strong></div><div><small>活动时间 / WHEN</small><strong>TBD / 待定</strong></div></section><section class="registration"><div class="spots">剩余名额 <span id="n">3</span> 位 </div><form id="f"><label>尊姓大名 / NAME<input name="name" autocomplete="name" required placeholder="请在此留下大名"></label><label>电子信箱 / EMAIL<input name="email" autocomplete="email" required type="email" placeholder="您的邮箱，非常重要"></label><button type="submit">☞ 立 即 抢 位 ☜</button></form><p id="msg" aria-live="polite"></p><p class="demo">报名演示：暂不保存姓名与邮箱，名额未在访客间同步。</p></section></main></div><dialog id="success" aria-labelledby="success-title"><strong id="success-title">报名成功！</strong><p>米面油等你来领！</p><p style="font-size:13px">演示成功 · 尚未提交真实报名</p><button type="button" id="close">好嘞！一言为定！</button><div id="confetti" aria-hidden="true"></div></dialog><script>
const form=document.querySelector('#f'),count=document.querySelector('#n'),message=document.querySelector('#msg'),success=document.querySelector('#success'),confetti=document.querySelector('#confetti');let remaining=3;
form.addEventListener('submit',event=>{event.preventDefault();if(!remaining)return;remaining--;count.textContent=remaining;message.textContent='恭喜抢位成功！（演示）';confetti.replaceChildren();success.showModal();if(!matchMedia('(prefers-reduced-motion: reduce)').matches){for(let i=0;i<30;i++){const piece=document.createElement('i');piece.textContent=['米','面','油','★','喜'][i%5];piece.style.setProperty('--x',Math.random()*100+'%');piece.style.setProperty('--d',Math.random()*.7+'s');piece.style.setProperty('--c',['#ff0080','#00b924','#1429d4','#e00000'][i%4]);confetti.append(piece)}}form.reset();if(!remaining){const button=form.querySelector('button');button.disabled=true;button.textContent='名额已抢光！'}});document.querySelector('#close').addEventListener('click',()=>success.close());success.addEventListener('close',()=>confetti.replaceChildren());
</script></body></html>
